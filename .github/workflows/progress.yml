name: Update curriculum progress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-progress
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test tracker
        run: node --test tests/*.test.mjs
      - name: Check candidate documentation
        run: node scripts/render-pools.mjs --check
  progress:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Test tracker
        run: node --test tests/*.test.mjs
      - name: Build progress
        run: node scripts/progress.mjs "$RUNNER_TEMP/curriculum-progress"
      - name: Publish only to progress branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish="$RUNNER_TEMP/progress-publish"
          if git show-ref --verify --quiet refs/remotes/origin/progress; then
            git worktree add -b publish-progress "$publish" origin/progress
          else
            git worktree add --detach "$publish" HEAD
            cd "$publish"
            git switch --orphan publish-progress
          fi
          cd "$publish"
          cp "$RUNNER_TEMP/curriculum-progress/README.md" README.md
          cp "$RUNNER_TEMP/curriculum-progress/progress.json" progress.json
          git add README.md progress.json
          if git diff --cached --quiet; then
            echo "No progress changes"
            exit 0
          fi
          git commit -m "Update curriculum progress"
          git push origin HEAD:refs/heads/progress
